name: Region content checks
on:
  push:
    branches: [main, 'codex/**', 'region/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "Pillow>=10,<13"
      - run: python Tools/Integration/validate_world.py
      - run: python -m unittest discover -s Tools/Integration -p 'test_*.py'
